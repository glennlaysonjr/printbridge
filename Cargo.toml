[package]
name = "printbridge"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "Local agent that lets web apps discover and print to every printer reachable from the user's machine (local queues, mDNS/AirPrint, RAW 9100, IPP)."
license = "MIT"
repository = "https://github.com/glennlaysonjr/printbridge"
readme = "README.md"
keywords = ["printing", "ipp", "mdns", "zpl", "printer"]
categories = ["command-line-utilities", "network-programming", "web-programming::http-server"]
exclude = ["tests/e2e/", "demo/", ".github/"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
if-addrs = "0.15.0"
mdns-sd = "0.21.7"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "process", "io-util", "fs"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Printing", "Win32_Graphics_Gdi", "Win32_Foundation"] }

[profile.release]
# Small, self-contained binaries for distribution.
lto = true
codegen-units = 1
strip = true
