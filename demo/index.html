<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PrintBridge Demo</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 860px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5;
    }
    h1 { font-size: 1.4rem; }
    .status { padding: .6rem 1rem; border-radius: 8px; margin: 1rem 0; font-weight: 600; }
    .status.ok { background: #e3f6e8; color: #14652b; }
    .status.bad { background: #fde8e8; color: #92231f; }
    @media (prefers-color-scheme: dark) {
      .status.ok { background: #123a1f; color: #7fd996; }
      .status.bad { background: #45191a; color: #f19d9a; }
    }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid #8884; font-size: .9rem; }
    button { padding: .45rem .9rem; border-radius: 6px; border: 1px solid #8886; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    .toolbar { display: flex; gap: .5rem; align-items: center; }
    textarea { width: 100%; height: 90px; margin-top: 1rem; font-family: ui-monospace, monospace; }
    #log { font-family: ui-monospace, monospace; font-size: .8rem; white-space: pre-wrap;
           background: #8881; padding: .8rem; border-radius: 8px; margin-top: 1rem; min-height: 3rem; }
    .pill { font-size: .72rem; padding: .1rem .5rem; border-radius: 999px; background: #8882; }
  </style>
</head>
<body>
  <h1>🖨️ PrintBridge demo</h1>
  <p>This page talks to the local PrintBridge agent on <code id="agent-addr">127.0.0.1:9631</code> through the JS SDK.</p>

  <div id="status" class="status bad">Checking agent…</div>

  <div class="toolbar">
    <button id="refresh" disabled>Rescan network</button>
    <span id="count" class="pill">0 printers</span>
  </div>

  <table>
    <thead>
      <tr><th>Name</th><th>Source</th><th>Host</th><th>Protocols</th><th>Model</th><th></th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <h3>Test payload (plain text / ZPL / ESC-POS)</h3>
  <textarea id="payload">Hello from PrintBridge!
</textarea>

  <div id="log">—</div>

  <script type="module">
    import { PrintBridge } from '../sdk/printbridge.js';

    const $ = (id) => document.getElementById(id);
    const log = (msg) => { $('log').textContent = `[${new Date().toLocaleTimeString()}] ${msg}\n` + $('log').textContent; };

    // ?agentPort=NNNN targets an agent on a non-default port (used by the e2e tests).
    const agentPort = Number(new URLSearchParams(location.search).get('agentPort')) || 9631;
    const bridge = new PrintBridge({ port: agentPort });
    $('agent-addr').textContent = `127.0.0.1:${agentPort}`;

    function render(printers) {
      $('count').textContent = `${printers.length} printer${printers.length === 1 ? '' : 's'}`;
      $('rows').innerHTML = '';
      // Printer names and models come from the network (mDNS), so they are inserted
      // as text, never as HTML.
      const cell = (text, pill = false) => {
        const td = document.createElement('td');
        const target = pill ? td.appendChild(Object.assign(document.createElement('span'), { className: 'pill' })) : td;
        target.textContent = text;
        return td;
      };
      for (const p of printers) {
        const tr = document.createElement('tr');
        const button = Object.assign(document.createElement('button'), { textContent: 'Print test' });
        button.dataset.id = p.id;
        tr.append(
          cell(`${p.name}${p.isDefault ? ' ⭐' : ''}`),
          cell(p.source, true),
          cell(`${p.host ?? '—'}${p.port ? ':' + p.port : ''}`),
          cell(p.protocols.join(', ')),
          cell(p.makeAndModel ?? '—'),
        );
        tr.appendChild(document.createElement('td')).appendChild(button);
        button.onclick = async (e) => {
          e.target.disabled = true;
          try {
            const r = await bridge.print({ printerId: p.id, text: $('payload').value, title: 'PrintBridge test' });
            log(`✅ ${p.name}: sent via ${r.via} — ${r.message ?? 'ok'}`);
          } catch (err) {
            log(`❌ ${p.name}: ${err.message}`);
          } finally {
            e.target.disabled = false;
          }
        };
        $('rows').appendChild(tr);
      }
    }

    async function main() {
      const ok = await bridge.connect();
      if (!ok) {
        $('status').textContent = 'Agent not reachable — start it with: printbridge   (or: cargo run)';
        log(`Agent unreachable on 127.0.0.1:${agentPort}`);
        setTimeout(main, 3000); // keep retrying so the page lights up when the agent starts
        return;
      }
      $('status').className = 'status ok';
      $('status').textContent = 'Connected to PrintBridge agent';
      $('refresh').disabled = false;

      bridge.on('printers', render);
      await bridge.subscribe();          // live updates
      render(await bridge.getPrinters()); // initial fill from cache

      $('refresh').onclick = async () => {
        $('refresh').disabled = true;
        log('Rescanning (mDNS + port sweep)…');
        try { render(await bridge.getPrinters({ refresh: true })); log('Scan complete'); }
        catch (err) { log(`Scan failed: ${err.message}`); }
        finally { $('refresh').disabled = false; }
      };
    }

    main();
  </script>
</body>
</html>
